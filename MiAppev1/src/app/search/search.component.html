<ActionBar class="action-bar">
  <NavigationButton visibility="hidden"></NavigationButton>
  <GridLayout columns="50, *">
    <Label class="action-bar-title" text="Search" colSpan="2"></Label>

    <Label class="fas" text="&#xf0c9;" (tap)="onDrawerButtonTap()"></Label>
  </GridLayout>
</ActionBar>

<GridLayout rows="auto, auto, auto, *" class="page__content">

  <GridLayout row="0" columns="*, auto, auto" class="search-form">
    <TextField
      col="0"
      class="search-input"
      hint="Buscar por nombre, cargo o área"
      returnKeyType="search"
      [(ngModel)]="consulta"
      (returnPress)="onReturnPress($event)"
    ></TextField>

    <Button col="1" class="search-button" text="Buscar" (tap)="buscar()" [isEnabled]="!cargando"></Button>

    <Button
      col="2"
      class="fas search-clear"
      text="&#xf00d;"
      (tap)="limpiar()"
      [visibility]="consulta ? 'visible' : 'collapse'"
    ></Button>
  </GridLayout>

  <StackLayout row="1">
    <GridLayout columns="*, auto" class="search-filter">
      <Label col="0" class="search-filter-label" text="Buscar solo por nombre" verticalAlignment="center"></Label>
      <Switch col="1" [(ngModel)]="soloNombre" (ngModelChange)="buscar()"></Switch>
    </GridLayout>

    <GridLayout columns="*, auto" class="search-filter">
      <Label col="0" class="search-filter-label" text="Solo favoritos" verticalAlignment="center"></Label>
      <Switch col="1" [(ngModel)]="soloFavoritos"></Switch>
    </GridLayout>
  </StackLayout>

  <Label row="2" class="search-summary" [text]="resumen" [visibility]="error ? 'collapse' : 'visible'"></Label>

  <ListView
    row="3"
    class="results-list"
    [items]="resultadosVisibles"
    (itemTap)="onItemTap($event)"
    [visibility]="!error && resultadosVisibles.length ? 'visible' : 'collapse'"
  >
    <ng-template let-empleado="item">
      <FlexboxLayout class="result-item" flexDirection="row" alignItems="center">
        <Label class="fas result-avatar" text="&#xf007;"></Label>

        <FlexboxLayout class="result-body" flexDirection="column" flexGrow="1">
          <Label class="result-name" [text]="empleado.name" textWrap="true"></Label>

          <FlexboxLayout class="result-tags" flexDirection="row" flexWrap="wrap">
            <Label class="result-tag" [text]="empleado.cargo"></Label>
            <Label class="result-tag result-tag--area" [text]="empleado.area"></Label>
          </FlexboxLayout>
        </FlexboxLayout>

        <Label
          class="result-favorito"
          [class.fas]="esFavorito(empleado)"
          [class.far]="!esFavorito(empleado)"
          [class.result-favorito--activo]="esFavorito(empleado)"
          text="&#xf005;"
          (tap)="alternarFavorito(empleado)"
        ></Label>

        <Label class="fas result-chevron" text="&#xf054;"></Label>
      </FlexboxLayout>
    </ng-template>
  </ListView>

  <Label
    row="3"
    class="search-empty"
    text="No se encontraron empleados"
    [visibility]="!error && !cargando && !resultadosVisibles.length ? 'visible' : 'collapse'"
  ></Label>

  <StackLayout row="3" class="search-error" [visibility]="error ? 'visible' : 'collapse'">
    <Label class="fas search-error__icon" [text]="sinConfigurar ? '&#xf013;' : '&#xf071;'"></Label>
    <Label class="search-error__text" [text]="error" textWrap="true"></Label>

    <Button
      class="search-error__button"
      text="Ir a Settings"
      (tap)="irAConfiguracion()"
      [visibility]="sinConfigurar ? 'visible' : 'collapse'"
    ></Button>

    <Button
      class="search-error__button"
      text="Reintentar"
      (tap)="buscar()"
      [visibility]="sinConfigurar ? 'collapse' : 'visible'"
    ></Button>
  </StackLayout>

  <StackLayout row="3" class="search-loading" [visibility]="cargando ? 'visible' : 'collapse'">
    <ActivityIndicator busy="true"></ActivityIndicator>
    <Label class="search-loading__text" text="Consultando el servidor..."></Label>
  </StackLayout>
</GridLayout>
